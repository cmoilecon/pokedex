<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#bg)"/>
  <rect x="6" y="6" width="52" height="52" rx="12" fill="none" stroke="#22c55e" stroke-width="3"/>

  <g transform="translate(32 32)" filter="url(#glow)">
    <circle r="22" fill="#f8fafc" stroke="#0f172a" stroke-width="4"/>
    <path d="M-22 0A22 22 0 0 1 22 0H-22Z" fill="#ef4444"/>
    <rect x="-22" y="-3" width="44" height="6" fill="#0f172a"/>
    <circle r="8" fill="#f8fafc" stroke="#0f172a" stroke-width="4"/>
    <circle r="3" fill="#22c55e"/>
  </g>
</svg>