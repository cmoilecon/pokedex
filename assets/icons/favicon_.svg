<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="greenGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>

    <linearGradient id="redTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fond -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#bg)"/>

  <!-- Contour vert -->
  <rect x="4.5" y="4.5" width="55" height="55" rx="13.5"
        fill="none" stroke="url(#greenGlow)" stroke-width="2"
        filter="url(#softGlow)"/>

  <!-- Pokéball -->
  <g transform="translate(32 32)">
    <circle r="18" fill="#f8fafc" stroke="#111827" stroke-width="2.5"/>
    <path d="M-18 0 A18 18 0 0 1 18 0 L18 0 L-18 0 Z" fill="url(#redTop)"/>
    <path d="M-18 0 A18 18 0 0 0 18 0 L18 0 L-18 0 Z" fill="#f8fafc"/>
    <rect x="-18" y="-2.7" width="36" height="5.4" fill="#111827"/>
    <circle r="6.8" fill="#f8fafc" stroke="#111827" stroke-width="2.5"/>
    <circle r="2.5" fill="#22c55e"/>
  </g>

  <!-- Petit effet Dex / digital -->
  <rect x="42" y="12" width="8" height="3" rx="1.5" fill="#22c55e" opacity="0.95"/>
  <rect x="42" y="17" width="6" height="2.6" rx="1.3" fill="#4ade80" opacity="0.8"/>
  <rect x="14" y="46" width="10" height="2.6" rx="1.3" fill="#4ade80" opacity="0.7"/>
</svg>